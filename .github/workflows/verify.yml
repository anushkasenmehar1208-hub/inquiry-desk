name: Verify Inquiry Desk

on:
  push:
    branches: [main, feature/stage3-lifecycle]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inquiry
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: inquiry_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inquiry -d inquiry_desk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://inquiry:ci_only_password@localhost:5432/inquiry_desk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inquiry-desk/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: inquiry-desk
      - name: Unit tests
        run: npm test
        working-directory: inquiry-desk
      - name: PostgreSQL integration tests
        run: npm run test:integration
        working-directory: inquiry-desk
      - name: Production frontend build
        run: npm run build -w web
        working-directory: inquiry-desk
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: inquiry-desk/web
      - name: Browser interaction tests (mocked API)
        run: npm run test:frontend
        working-directory: inquiry-desk
