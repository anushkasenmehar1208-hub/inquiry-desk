services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inquiry
      POSTGRES_PASSWORD: inquiry_local_only
      POSTGRES_DB: inquiry_desk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inquiry -d inquiry_desk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pg_data:
